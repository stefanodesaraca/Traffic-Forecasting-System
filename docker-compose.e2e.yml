version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    
    data_service:
      build:
        context: .
        dockerfile: services/data_service/Dockerfile
      environment:
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
        RABBITMQ_HOST: rabbitmq
        RABBITMQ_PORT: "5672"
      ports:
        - "8002:8002"
      depends_on:
        - postgres
        - rabbitmq

    api_gateway:
      build:
        context: .
        dockerfile: services/api_gateway/Dockerfile
      environment:
        RABBITMQ_HOST: rabbitmq
        RABBITMQ_PORT: "5672"
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
      ports:
        - "8000:8000"
      depends_on:
        - data_service
        - rabbitmq
